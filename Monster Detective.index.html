Create a complete, single-file HTML5 interactive micro-game designed to be hosted directly on GitHub Pages for Primary 1 students based on the specification below. The generated code must contain all HTML, CSS (in <style>), and JavaScript (in <script>) inside ONE fully functional file (`index.html`) with zero external image or audio file dependencies (use SVG/CSS graphics and Browser Web Audio / Speech Synthesis APIs).

---

### 1. Learning Purpose
- Target Audience: Primary 1 (P.1 / Age 6-7) ESL / EFL students in Hong Kong.
- Subject: English Language (Vocabulary & Listening/Reading Comprehension).
- Topic: Target Adjectives — `big`, `small`, `fat`, `thin`, `short`, `long`.
- Educational Goal:
  1. Accurately recognize and differentiate the 6 target adjectives visually, textually, and audibly.
  2. Associate target adjectives with physical attributes (overall size, weight, limbs, and tails).
  3. Complete 3 progressive mystery cases within a 5-minute micro-learning loop.

---

### 2. Game Concept
- Game Title: Monster Detective Agency (怪獸偵探社)
- Story Background: Mischievous monsters are causing chaos in Monster Town! The Chief Detective needs a smart P.1 rookie detective to solve case files by identifying the right monsters based on witness reports.
- Student Role: Junior Detective.
- Core Mission: Inspect suspect line-ups, listen to/read case clues, and interact with tools to identify and arrest the matching suspect.
- Win Condition: Successfully catch the correct monster in all 3 cases (Level 1 to Level 3) to earn the "Master Detective Badge".

---

### 3. Learning Journey & Game Flow
1. Welcome Screen: 
   - Story introduction ("Welcome to Monster Detective Agency!").
   - Large, clear instructions with a built-in sound toggle test.
   - Prominent "START CASE" button.
2. Level 1 (Case #1: Size Contrast - Big vs Small):
   - Clue text & Audio prompt: "The suspect is BIG!"
   - Suspect Line-up: 4 procedural SVG monsters (e.g., 1 Big Fat, 1 Small Thin, 1 Long, 1 Short).
   - Action: Single-click/tap to select the target monster.
3. Level 2 (Case #2: Body Proportions - Fat vs Thin, Long vs Short):
   - Clue text & Audio prompt: "Look for a monster with a LONG neck and THIN legs!"
   - Suspect Line-up: 4 distinct SVG monsters with varying features.
   - Action: Drag & Drop the "ARREST" magnifying tool directly onto the target suspect card.
4. Level 3 (Case #3: Multi-Attribute Synthesis - 3 Combined Adjectives):
   - Clue text & Audio prompt: "Catch the thief! He is SMALL, FAT, and has a SHORT tail!"
   - Suspect Line-up: 4 challenging suspects with overlapping attributes.
   - Action: Interactive Detective Checklist (tick target trait badges `[Small]` `[Fat]` `[Short tail]`, then hit "CONFIRM ARREST").
5. Victory Screen: 
   - Confetti animation (CSS/Canvas based).
   - Summary of solved cases and Master Detective Badge presentation.
   - "PLAY AGAIN" button to reset state cleanly.

---

### 4. Game Mechanics (Multi-Interactive Operations)
- Level 1 - Click / Tap Identification: Direct selection of suspect cards with high visual feedback.
- Level 2 - Drag and Drop: Touch and mouse-compatible drag-and-drop of an "ARREST" badge onto suspect cards.
- Level 3 - Feature Matching Checklist & Decision Confirmation: Toggle interactive trait tags to match evidence before submitting the final verdict.
- Audio Integration: Native Browser SpeechSynthesis API for auto-reading clues and playing clean Web Audio API sound effects (beeps, success chimes, failure buzzes).

---

### 5. Questions & Content Matrix

| Level | Case File Clue Sentence | Target Vocabulary | Correct Monster Attributes | Distractor Monsters |
| :--- | :--- | :--- | :--- | :--- |
| **Level 1** | "Case #1: Find the suspect! The monster is **BIG** and **FAT**." | `big`, `fat` | Huge round body & belly monster | 1 small thin, 1 long snake-like, 1 short tiny monster |
| **Level 2** | "Case #2: Clue updated! The suspect has a **LONG** neck and **THIN** legs." | `long`, `thin` | Monster with exaggerated long neck & stick legs | 1 short neck fat legs, 1 big round monster, 1 small short neck monster |
| **Level 3** | "Case #3: Urgent! Catch the monster that is **SMALL**, **FAT**, with a **SHORT** tail!" | `small`, `fat`, `short` | Small body height, chubby shape, stubby tail | 1 big fat long tail, 1 small thin long tail, 1 big thin short tail |

---

### 6. Feedback & Hint Design
- Instant Action Feedback:
  - Correct Selection:
    - Visual: Screen highlights in green, star animations appear, suspect gets a "CAUGHT" overlay animation.
    - Audio: High-pitched cheerful chime + Speech Synthesis voice reading ("Great job! The monster is big and fat!").
    - Logic: Auto-advances to the next level after 1.5 seconds.
  - Incorrect Selection:
    - Visual: Gentle card shake animation (no scary penalizing screens), orange highlight showing mismatched feature.
    - Audio: Soft "Uh-oh! Try again!" prompt.
    - Pedagogical Hint System: Chief Detective speech bubble displays a targeted tip (e.g., "Hint: Check the tail! Is it LONG or SHORT?"), allowing immediate retries without losing score or restarting.

---

### 7. Difficulty Progression
- Level 1 (Basic Recognition): Focuses on 1-2 prominent contrasting adjectives with high visual differentiation.
- Level 2 (Detailed Feature Inspection): Combines 2 body attributes (Long/Short limbs + Fat/Thin body).
- Level 3 (Multi-Step Logic Synthesis): Combines 3 adjectives simultaneously, requiring systematic comparison before confirmation.

---

### 8. Student Experience (UI/UX for P.1 Kids)
- Visual Style: Bright cartoon aesthetic (soft rounded corners, high-contrast buttons, friendly CSS/SVG monsters).
- Typography: Readable rounded fonts (e.g., Arial, system-rounded), font size ≥ 22px for clues, ≥ 28px for headings.
- Layout:
  - Top Bar: Progress indicator (Case 1/3, 2/3, 3/3), Audio toggle switch, Chief Detective avatar.
  - Main Area: Interactive suspect stage (responsive grid: 2x2 on tablets/phones, 1x4 or 2x2 on desktop).
  - Bottom Bar: Interactive tools (Magnifying Glass / Evidence Badges).
- Touch & Mouse Compatibility: Minimum touch target size of 60x60px. Full support for touch events (`touchstart`, `touchmove`, `touchend`) alongside standard mouse events.
- Zero Friction: No login, password, or local account creation required. State resets cleanly on reload.

---

### 9. Technical & GitHub Requirements
- Output Format: Generate a single `index.html` file containing HTML, inline CSS (`<style>`), and inline JavaScript (`<script>`).
- GitHub Pages Ready: Must work immediately when pushed to a GitHub repository root or `/docs` folder without any build pipeline or node dependencies.
- Zero External Requests: All graphics MUST be generated via inline SVG or CSS shapes. Sounds MUST use browser Web Audio API synthesizer / SpeechSynthesis API to ensure offline/GitHub Pages stability.
- Responsive & Performant: Works seamlessly across iOS Safari (iPads), Chrome, Android tablets, and desktop browsers at 60fps.
